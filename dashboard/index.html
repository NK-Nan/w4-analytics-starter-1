<!doctype html>
<html lang="th">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>แดชบอร์ดคำสั่งซื้อร้านออนไลน์</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bai+Jamjuree:wght@500;600;700&family=IBM+Plex+Sans+Thai:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap">
<style>
  /* เลย์เอาต์: แถบหัวพร้อมปุ่มอัปโหลด → ตัวกรอง → การ์ด KPI 4 ใบ + แถบตรวจสอบข้อมูล → กราฟ 2 ช่อง (ซ้อนเป็นคอลัมน์เดียวบนมือถือ) */
  :root {
    --bg: #f3f5f7;
    --surface: #ffffff;
    --ink: #17222b;
    --muted: #5b6a76;
    --line: #dbe1e6;
    --accent: #0f6d78;
    --accent-soft: #d8eef0;
    --bar: #3b8f99;
    --ok: #2f7d4f;
    --warn: #a3650a;
    --bad: #b23a3a;
    --ok-soft: #e1f1e6;
    --warn-soft: #f8ecd6;
    --bad-soft: #f7e1e1;
    --font-display: "Bai Jamjuree", "IBM Plex Sans Thai", "Noto Sans Thai", sans-serif;
    --font-body: "IBM Plex Sans Thai", "Noto Sans Thai", "Leelawadee UI", system-ui, sans-serif;
    --font-data: "IBM Plex Mono", ui-monospace, "SFMono-Regular", Menlo, monospace;
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --bg: #0f161b; --surface: #172128; --ink: #e5ecf0; --muted: #93a3ae; --line: #2a3841;
      --accent: #5cc3cd; --accent-soft: #173a3f; --bar: #4fb0ba;
      --ok: #6cc690; --warn: #e2a64a; --bad: #ec7f7f;
      --ok-soft: #173326; --warn-soft: #3a2c13; --bad-soft: #3d1d1d;
      color-scheme: dark;
    }
  }
  :root[data-theme="dark"] {
    --bg: #0f161b; --surface: #172128; --ink: #e5ecf0; --muted: #93a3ae; --line: #2a3841;
    --accent: #5cc3cd; --accent-soft: #173a3f; --bar: #4fb0ba;
    --ok: #6cc690; --warn: #e2a64a; --bad: #ec7f7f;
    --ok-soft: #173326; --warn-soft: #3a2c13; --bad-soft: #3d1d1d;
    color-scheme: dark;
  }
  * { box-sizing: border-box; }
  body {
    background: var(--bg); color: var(--ink);
    font-family: var(--font-body); font-size: 15px; line-height: 1.55;
  }
  .wrap {
    max-width: 1180px; margin: 0 auto;
    padding-block: 28px 48px;
    padding-left: max(16px, env(safe-area-inset-left, 0px));
    padding-right: max(16px, env(safe-area-inset-right, 0px));
    display: grid; gap: 20px;
  }
  header { display: flex; flex-wrap: wrap; gap: 16px; align-items: flex-end; justify-content: space-between; }
  h1 { font-family: var(--font-display); font-weight: 700; font-size: 1.75rem; line-height: 1.2; margin: 0; text-wrap: balance; }
  .sub { color: var(--muted); margin: 4px 0 0; font-size: 0.92rem; }
  .eyebrow { font-size: 0.75rem; letter-spacing: 0.06em; color: var(--muted); text-transform: uppercase; font-weight: 600; }
  .upload { display: flex; flex-direction: column; align-items: flex-end; gap: 4px; }
  .btn {
    display: inline-flex; align-items: center; gap: 8px; cursor: pointer;
    background: var(--accent); color: var(--surface); border: 0; border-radius: 8px;
    padding: 10px 16px; font: 600 0.95rem var(--font-body);
  }
  .btn:hover { filter: brightness(1.08); }
  .btn:focus-within, .btn:focus-visible { outline: 3px solid var(--accent-soft); outline-offset: 2px; }
  .btn input { position: absolute; width: 1px; height: 1px; opacity: 0; }
  .filename { font-size: 0.8rem; color: var(--muted); font-family: var(--font-data); max-width: 320px; overflow-wrap: anywhere; text-align: right; }

  .filters { display: flex; flex-wrap: wrap; gap: 12px 20px; align-items: flex-end; padding: 14px 16px; background: var(--surface); border: 1px solid var(--line); border-radius: 10px; }
  .field { display: grid; gap: 4px; min-width: 0; flex: 1 1 220px; }
  .field label { font-size: 0.8rem; color: var(--muted); font-weight: 500; }
  select {
    font: 500 0.95rem var(--font-body); color: var(--ink); background: var(--bg);
    border: 1px solid var(--line); border-radius: 7px; padding: 8px 10px; width: 100%;
  }
  select:focus-visible { outline: 2px solid var(--accent); outline-offset: 1px; }
  .reset { background: none; border: 1px solid var(--line); color: var(--ink); border-radius: 7px; padding: 8px 12px; font: 500 0.9rem var(--font-body); cursor: pointer; }
  .reset:hover { border-color: var(--accent); color: var(--accent); }
  .reset:focus-visible { outline: 2px solid var(--accent); }

  .kpis { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 14px; }
  @media (max-width: 900px) { .kpis { grid-template-columns: repeat(2, minmax(0, 1fr)); } }
  @media (max-width: 420px) { .kpis { grid-template-columns: minmax(0, 1fr); } }
  .kpi { background: var(--surface); border: 1px solid var(--line); border-radius: 10px; padding: 16px; display: grid; gap: 6px; align-content: start; }
  .kpi .label { font-size: 0.85rem; color: var(--muted); font-weight: 500; }
  .kpi .value { font-family: var(--font-display); font-weight: 600; font-size: 1.7rem; line-height: 1.15; font-variant-numeric: tabular-nums; overflow-wrap: anywhere; }
  .kpi .def { font-size: 0.75rem; color: var(--muted); line-height: 1.45; }
  .kpi.lead .value { color: var(--accent); }

  .audit { display: flex; flex-wrap: wrap; gap: 10px 18px; align-items: center; font-size: 0.88rem; padding: 10px 14px; border: 1px dashed var(--line); border-radius: 10px; }
  .audit strong { font-family: var(--font-data); font-weight: 500; font-variant-numeric: tabular-nums; }
  .pill { display: inline-flex; gap: 6px; align-items: baseline; padding: 3px 10px; border-radius: 999px; font-size: 0.85rem; }
  .pill.ok { background: var(--ok-soft); color: var(--ok); }
  .pill.warn { background: var(--warn-soft); color: var(--warn); }
  .pill.bad { background: var(--bad-soft); color: var(--bad); }
  .pill.other { background: var(--bg); color: var(--muted); border: 1px solid var(--line); }
  .pill b { font-family: var(--font-data); font-weight: 500; }
  .audit .note { color: var(--warn); }

  .charts { display: grid; grid-template-columns: minmax(0, 3fr) minmax(0, 2fr); gap: 14px; }
  @media (max-width: 900px) { .charts { grid-template-columns: minmax(0, 1fr); } }
  .panel { background: var(--surface); border: 1px solid var(--line); border-radius: 10px; padding: 16px; min-width: 0; display: grid; gap: 8px; align-content: start; }
  .panel h2 { font-family: var(--font-display); font-weight: 600; font-size: 1.05rem; margin: 0; }
  .panel .hint { font-size: 0.8rem; color: var(--muted); margin: 0; }
  .chart { width: 100%; overflow-x: auto; }
  svg text { fill: var(--muted); font-family: var(--font-body); font-size: 11px; }
  svg .val { fill: var(--ink); font-family: var(--font-data); font-size: 11px; }
  svg .grid { stroke: var(--line); stroke-width: 1; }
  .tip { font-family: var(--font-data); font-size: 0.82rem; color: var(--ink); min-height: 1.4em; }

  .empty { background: var(--surface); border: 1px dashed var(--line); border-radius: 12px; padding: 40px 24px; text-align: center; display: grid; gap: 10px; justify-items: center; }
  .empty h2 { font-family: var(--font-display); font-size: 1.25rem; margin: 0; }
  .empty p { margin: 0; color: var(--muted); max-width: 60ch; }
  .empty code { font-family: var(--font-data); font-size: 0.85rem; background: var(--bg); padding: 1px 6px; border-radius: 4px; overflow-wrap: anywhere; }
  .error { background: var(--bad-soft); color: var(--bad); padding: 12px 14px; border-radius: 10px; }
  footer { font-size: 0.78rem; color: var(--muted); }
  @media (prefers-reduced-motion: reduce) { * { transition: none !important; animation: none !important; } }
</style>
</head>
<body>

<div id="root"></div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/react/18.3.1/umd/react.production.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/react-dom/18.3.1/umd/react-dom.production.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/PapaParse/5.4.1/papaparse.min.js"></script>
<script src="https://unpkg.com/htm@3.1.1/dist/htm.umd.js"></script>
<script>
(function () {
  const { useState, useMemo } = React;
  const html = htm.bind(React.createElement);

  const SUCCESS = "จัดส่งสำเร็จ";
  const CANCELLED = "ยกเลิก";
  const RETURNED = "คืนสินค้า";
  const ALL = "__all__";
  const REQUIRED = ["order_id", "order_datetime", "channel", "region", "category", "qty", "unit_price", "discount_pct", "status"];

  const fmtBaht = new Intl.NumberFormat("th-TH", { style: "currency", currency: "THB", maximumFractionDigits: 0 });
  const fmtBaht2 = new Intl.NumberFormat("th-TH", { style: "currency", currency: "THB", minimumFractionDigits: 2, maximumFractionDigits: 2 });
  const fmtInt = new Intl.NumberFormat("th-TH");
  const fmtPct = new Intl.NumberFormat("th-TH", { style: "percent", minimumFractionDigits: 2, maximumFractionDigits: 2 });
  const fmtMonth = new Intl.DateTimeFormat("th-TH", { month: "short", year: "2-digit" });
  const fmtShort = (n) => {
    if (Math.abs(n) >= 1e6) return (n / 1e6).toFixed(n >= 1e7 ? 0 : 1) + " ล.";
    if (Math.abs(n) >= 1e3) return Math.round(n / 1e3) + " พ.";
    return String(Math.round(n));
  };
  const monthLabel = (ym) => {
    const [y, m] = ym.split("-").map(Number);
    return fmtMonth.format(new Date(y, m - 1, 1));
  };

  // แปลงแถวดิบจาก PapaParse ให้เป็นแถวที่ใช้คำนวณได้ แถวที่ตัวเลขผิดรูปจะถูกนับแยกไว้
  function cleanRows(raw) {
    const rows = [];
    let invalid = 0;
    for (const r of raw) {
      const qty = Number(String(r.qty ?? "").trim());
      const price = Number(String(r.unit_price ?? "").trim());
      const discRaw = String(r.discount_pct ?? "").trim();
      const disc = discRaw === "" ? 0 : Number(discRaw);
      const month = String(r.order_datetime ?? "").trim().slice(0, 7);
      if (!Number.isFinite(qty) || !Number.isFinite(price) || !Number.isFinite(disc) || !/^\d{4}-\d{2}$/.test(month)) {
        invalid++;
        continue;
      }
      rows.push({
        orderId: String(r.order_id ?? "").trim(),
        month,
        channel: String(r.channel ?? "").trim() || "(ไม่ระบุ)",
        region: String(r.region ?? "").trim() || "(ไม่ระบุ)",
        category: String(r.category ?? "").trim() || "(ไม่ระบุ)",
        status: String(r.status ?? "").trim() || "(ไม่ระบุ)",
        net: qty * price * (1 - disc / 100),
      });
    }
    return { rows, invalid };
  }

  // คำนวณ KPI และข้อมูลกราฟจากแถวที่ผ่านตัวกรองแล้ว
  function summarize(rows) {
    let netSales = 0;
    const successIds = new Set();
    const allIds = new Set();
    const cancelIds = new Set();
    const byMonth = new Map();
    const byChannel = new Map();
    const statusCounts = new Map();
    for (const r of rows) {
      allIds.add(r.orderId);
      statusCounts.set(r.status, (statusCounts.get(r.status) || 0) + 1);
      if (r.status === CANCELLED) cancelIds.add(r.orderId);
      if (!byMonth.has(r.month)) byMonth.set(r.month, 0);
      if (r.status !== SUCCESS) continue;
      netSales += r.net;
      successIds.add(r.orderId);
      byMonth.set(r.month, byMonth.get(r.month) + r.net);
      byChannel.set(r.channel, (byChannel.get(r.channel) || 0) + r.net);
    }
    const orders = successIds.size;
    return {
      netSales,
      orders,
      aov: orders ? netSales / orders : 0,
      cancelRate: allIds.size ? cancelIds.size / allIds.size : 0,
      totalOrders: allIds.size,
      cancelled: cancelIds.size,
      monthly: [...byMonth.entries()].sort((a, b) => a[0].localeCompare(b[0])).map(([m, v]) => ({ key: m, value: v })),
      channels: [...byChannel.entries()].sort((a, b) => b[1] - a[1]).map(([c, v]) => ({ key: c, value: v })),
      statusCounts: [...statusCounts.entries()].sort((a, b) => b[1] - a[1]),
    };
  }

  function niceMax(v) {
    if (v <= 0) return 1;
    const p = Math.pow(10, Math.floor(Math.log10(v)));
    for (const s of [1, 1.2, 1.5, 2, 2.5, 3, 4, 5, 6, 8, 10]) if (s * p >= v) return s * p;
    return 10 * p;
  }

  function LineChart({ data }) {
    const [hover, setHover] = useState(null);
    const W = 640, H = 260, L = 52, R = 16, T = 16, B = 34;
    if (!data.length) return html`<p class="hint">ไม่มีข้อมูลในตัวกรองนี้</p>`;
    const max = niceMax(Math.max(...data.map((d) => d.value)));
    const x = (i) => data.length === 1 ? L + (W - L - R) / 2 : L + (i * (W - L - R)) / (data.length - 1);
    const y = (v) => T + (H - T - B) * (1 - v / max);
    const ticks = [0, 0.25, 0.5, 0.75, 1].map((f) => f * max);
    const path = data.map((d, i) => `${i ? "L" : "M"}${x(i).toFixed(1)},${y(d.value).toFixed(1)}`).join(" ");
    const area = `${path} L${x(data.length - 1).toFixed(1)},${y(0)} L${x(0).toFixed(1)},${y(0)} Z`;
    const step = data.length > 14 ? Math.ceil(data.length / 12) : 1;
    const h = hover ?? data.length - 1;
    return html`
      <div class="chart">
        <svg viewBox="0 0 ${W} ${H}" width="100%" role="img" aria-label="กราฟเส้นยอดขายสุทธิรายเดือน" style=${{ minWidth: "420px", display: "block" }}
             onMouseLeave=${() => setHover(null)}>
          ${ticks.map((t) => html`<g key=${t}>
              <line class="grid" x1=${L} x2=${W - R} y1=${y(t)} y2=${y(t)} />
              <text x=${L - 8} y=${y(t) + 4} text-anchor="end">${fmtShort(t)}</text>
            </g>`)}
          <path d=${area} fill="var(--accent-soft)" stroke="none" />
          <path d=${path} fill="none" stroke="var(--accent)" stroke-width="2.25" stroke-linejoin="round" />
          ${data.map((d, i) => html`<g key=${d.key}>
              ${i % step === 0 || i === data.length - 1 ? html`<text x=${x(i)} y=${H - 12} text-anchor="middle">${monthLabel(d.key)}</text>` : null}
              <circle cx=${x(i)} cy=${y(d.value)} r=${i === h ? 5 : 3} fill=${i === h ? "var(--accent)" : "var(--surface)"} stroke="var(--accent)" stroke-width="2" />
              <rect x=${x(i) - (W - L - R) / Math.max(data.length, 1) / 2} y=${T} width=${(W - L - R) / Math.max(data.length, 1)} height=${H - T - B}
                    fill="transparent" onMouseEnter=${() => setHover(i)} onClick=${() => setHover(i)} />
            </g>`)}
        </svg>
      </div>
      <div class="tip">${monthLabel(data[h].key)} · ${fmtBaht.format(data[h].value)}</div>`;
  }

  function BarChart({ data }) {
    if (!data.length) return html`<p class="hint">ไม่มียอดขายสำเร็จในตัวกรองนี้</p>`;
    const W = 440, rowH = 38, L = 104, R = 96, T = 6;
    const H = T + data.length * rowH + 4;
    const max = niceMax(Math.max(...data.map((d) => d.value)));
    const total = data.reduce((s, d) => s + d.value, 0);
    const xw = (v) => ((W - L - R) * v) / max;
    return html`
      <div class="chart">
        <svg viewBox="0 0 ${W} ${H}" width="100%" role="img" aria-label="กราฟแท่งยอดขายสุทธิตามช่องทาง" style=${{ display: "block" }}>
          ${data.map((d, i) => {
            const yy = T + i * rowH;
            return html`<g key=${d.key}>
              <text x=${L - 10} y=${yy + rowH / 2 + 4} text-anchor="end" style=${{ fill: "var(--ink)", fontSize: "12px" }}>${d.key}</text>
              <rect x=${L} y=${yy + 8} width=${W - L - R} height=${rowH - 16} rx="4" fill="var(--bg)" />
              <rect x=${L} y=${yy + 8} width=${Math.max(xw(d.value), 2)} height=${rowH - 16} rx="4" fill=${i === 0 ? "var(--accent)" : "var(--bar)"} />
              <text class="val" x=${L + xw(d.value) + 6} y=${yy + rowH / 2 + 4}>${fmtShort(d.value)} · ${Math.round((d.value / total) * 100)}%</text>
            </g>`;
          })}
        </svg>
      </div>`;
  }

  function statusClass(s) {
    if (s === SUCCESS) return "ok";
    if (s === CANCELLED) return "bad";
    if (s === RETURNED) return "warn";
    return "other";
  }

  function App() {
    const [state, setState] = useState({ phase: "idle" });
    const [region, setRegion] = useState(ALL);
    const [category, setCategory] = useState(ALL);

    function onFile(e) {
      const file = e.target.files && e.target.files[0];
      if (!file) return;
      setState({ phase: "loading", fileName: file.name });
      Papa.parse(file, {
        header: true,
        skipEmptyLines: "greedy",
        encoding: "UTF-8",
        // ตัด BOM (U+FEFF) ที่อาจติดมากับชื่อคอลัมน์แรก
        transformHeader: (h) => h.replace(/^﻿/, "").trim(),
        complete: (res) => {
          const fields = res.meta.fields || [];
          const missing = REQUIRED.filter((c) => !fields.includes(c));
          if (missing.length) {
            setState({ phase: "error", fileName: file.name, message: `ไฟล์นี้ไม่มีคอลัมน์ ${missing.join(", ")} กรุณาเลือกไฟล์ orders.csv ที่มีหัวตารางครบ` });
            return;
          }
          const { rows, invalid } = cleanRows(res.data);
          setRegion(ALL);
          setCategory(ALL);
          setState({ phase: "ready", fileName: file.name, rows, rawCount: res.data.length, invalid, parseErrors: res.errors.length });
        },
        error: (err) => setState({ phase: "error", fileName: file.name, message: `อ่านไฟล์ไม่สำเร็จ: ${err.message}` }),
      });
      e.target.value = "";
    }

    const rows = state.phase === "ready" ? state.rows : [];
    const regions = useMemo(() => [...new Set(rows.map((r) => r.region))].sort((a, b) => a.localeCompare(b, "th")), [rows]);
    const categories = useMemo(() => [...new Set(rows.map((r) => r.category))].sort((a, b) => a.localeCompare(b, "th")), [rows]);
    const filtered = useMemo(
      () => rows.filter((r) => (region === ALL || r.region === region) && (category === ALL || r.category === category)),
      [rows, region, category]
    );
    const s = useMemo(() => summarize(filtered), [filtered]);
    const isFiltered = region !== ALL || category !== ALL;

    const uploadBtn = html`
      <div class="upload">
        <label class="btn" for="csv-input">
          <svg width="16" height="16" viewBox="0 0 16 16" aria-hidden="true"><path d="M8 11V2M4.5 5.5 8 2l3.5 3.5M2 11v3h12v-3" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/></svg>
          ${state.phase === "ready" ? "เปลี่ยนไฟล์" : "อัปโหลด orders.csv"}
          <input id="csv-input" type="file" accept=".csv,text/csv" onChange=${onFile} />
        </label>
        ${state.fileName ? html`<span class="filename">${state.fileName}</span>` : null}
      </div>`;

    return html`
      <div class="wrap">
        <header>
          <div>
            <div class="eyebrow">สำหรับผู้จัดการร้าน</div>
            <h1>แดชบอร์ดคำสั่งซื้อร้านออนไลน์</h1>
            <p class="sub">อ่านจากไฟล์ orders.csv ในเครื่องคุณ ข้อมูลไม่ถูกส่งออกไปที่ใด</p>
          </div>
          ${uploadBtn}
        </header>

        ${state.phase === "error" ? html`<div class="error" role="alert">${state.message}</div>` : null}

        ${state.phase !== "ready" ? html`
          <section class="empty">
            <div class="eyebrow">${state.phase === "loading" ? "กำลังอ่านไฟล์…" : "ยังไม่มีข้อมูล"}</div>
            <h2>อัปโหลดไฟล์ orders.csv เพื่อดูยอดขาย</h2>
            <p>ไฟล์เป็น UTF-8 (มี BOM ได้) หัวตารางต้องมี <code>${REQUIRED.join(", ")}</code></p>
            <p>เมื่ออ่านเสร็จ หน้านี้จะแสดงยอดขายสุทธิ จำนวนคำสั่งซื้อสำเร็จ AOV อัตรายกเลิก กราฟยอดรายเดือน และยอดตามช่องทาง</p>
          </section>` : html`
          <section class="filters" aria-label="ตัวกรอง">
            <div class="field">
              <label for="f-region">ภูมิภาค</label>
              <select id="f-region" value=${region} onChange=${(e) => setRegion(e.target.value)}>
                <option value=${ALL}>ทุกภูมิภาค</option>
                ${regions.map((r) => html`<option key=${r} value=${r}>${r}</option>`)}
              </select>
            </div>
            <div class="field">
              <label for="f-category">หมวดสินค้า</label>
              <select id="f-category" value=${category} onChange=${(e) => setCategory(e.target.value)}>
                <option value=${ALL}>ทุกหมวด</option>
                ${categories.map((c) => html`<option key=${c} value=${c}>${c}</option>`)}
              </select>
            </div>
            ${isFiltered ? html`<button class="reset" type="button" onClick=${() => { setRegion(ALL); setCategory(ALL); }}>ล้างตัวกรอง</button>` : null}
          </section>

          <section class="kpis" aria-label="ตัวชี้วัดหลัก">
            <div class="kpi lead">
              <div class="label">ยอดขายสุทธิ</div>
              <div class="value">${fmtBaht.format(s.netSales)}</div>
              <div class="def">qty × unit_price × (1 − discount_pct/100) เฉพาะสถานะ "จัดส่งสำเร็จ" ไม่รวมค่าส่ง</div>
            </div>
            <div class="kpi">
              <div class="label">คำสั่งซื้อสำเร็จ</div>
              <div class="value">${fmtInt.format(s.orders)}</div>
              <div class="def">จำนวน order_id ที่สถานะ "จัดส่งสำเร็จ"</div>
            </div>
            <div class="kpi">
              <div class="label">AOV (มูลค่าเฉลี่ยต่อคำสั่งซื้อ)</div>
              <div class="value">${fmtBaht2.format(s.aov)}</div>
              <div class="def">ยอดขายสุทธิ ÷ คำสั่งซื้อสำเร็จ</div>
            </div>
            <div class="kpi">
              <div class="label">อัตรายกเลิก</div>
              <div class="value">${fmtPct.format(s.cancelRate)}</div>
              <div class="def">คำสั่งซื้อ "ยกเลิก" ${fmtInt.format(s.cancelled)} ÷ คำสั่งซื้อทั้งหมด ${fmtInt.format(s.totalOrders)}</div>
            </div>
          </section>

          <section class="audit" aria-label="ตรวจสอบข้อมูลที่อ่านได้">
            <span>อ่านได้ <strong>${fmtInt.format(state.rawCount)}</strong> แถว</span>
            ${isFiltered ? html`<span>ตรงตัวกรอง <strong>${fmtInt.format(filtered.length)}</strong> แถว</span>` : null}
            ${s.statusCounts.map(([st, n]) => html`<span key=${st} class=${"pill " + statusClass(st)}>${st} <b>${fmtInt.format(n)}</b></span>`)}
            ${state.invalid ? html`<span class="note">ข้าม ${fmtInt.format(state.invalid)} แถวที่ตัวเลขหรือวันที่ผิดรูป</span>` : null}
            ${state.parseErrors ? html`<span class="note">PapaParse แจ้งปัญหา ${fmtInt.format(state.parseErrors)} จุด</span>` : null}
          </section>

          <section class="charts">
            <div class="panel">
              <h2>ยอดขายสุทธิรายเดือน</h2>
              <p class="hint">ชี้หรือแตะจุดบนเส้นเพื่อดูยอดของเดือนนั้น</p>
              <${LineChart} data=${s.monthly} />
            </div>
            <div class="panel">
              <h2>ยอดขายสุทธิตามช่องทาง</h2>
              <p class="hint">เรียงจากมากไปน้อย ตัวเลขหลังจุดคือส่วนแบ่งของยอดรวม</p>
              <${BarChart} data=${s.channels} />
            </div>
          </section>`}

        <footer>คำนวณในเบราว์เซอร์ทั้งหมด · ล. = ล้านบาท · พ. = พันบาท</footer>
      </div>`;
  }

  ReactDOM.createRoot(document.getElementById("root")).render(html`<${App} />`);
})();
</script>
</body>
</html>
